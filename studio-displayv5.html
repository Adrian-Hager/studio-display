<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Studio Display</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #ffffff;
    --gold-light: #ffffff;
    --dark: #0A0A0A;
    --dark2: #111111;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--dark);
    overflow: hidden;
    font-family: 'Montserrat', sans-serif;
    cursor: none;
  }

  /* ── LOGO SCREEN ── */
  #logo-screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--dark);
    transition: opacity 1.2s ease;
    z-index: 10;
  }

  .logo-inner {
    text-align: center;
    animation: breathe 4s ease-in-out infinite;
  }

  .logo-mark {
    width: 120px; height: 120px;
    margin: 0 auto 32px;
    border: 2px solid var(--gold);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    animation: rotateBorder 12s linear infinite;
  }

  .logo-mark::before {
    content: '';
    position: absolute; inset: 8px;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 50%;
  }

  .logo-mark::after {
    content: '';
    position: absolute;
    width: 6px; height: 6px;
    background: var(--gold);
    border-radius: 50%;
    top: -4px; left: 50%; transform: translateX(-50%);
  }

  .logo-mark svg {
    width: 48px; height: 48px;
    fill: var(--gold);
  }

  .logo-studio-name {
    font-family: 'Bebas Neue', cursive;
    font-size: 52px;
    letter-spacing: 12px;
    color: #fff;
    text-transform: uppercase;
    line-height: 1;
  }

  .logo-tagline {
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--gold);
    text-transform: uppercase;
    margin-top: 10px;
    font-weight: 300;
  }

  .logo-time {
    position: fixed;
    bottom: 48px; right: 48px;
    font-family: 'Bebas Neue', cursive;
    font-size: 20px;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.4);
  }

  /* ── WELCOME SCREEN ── */
  #welcome-screen {
    position: fixed; inset: 0;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--dark);
    opacity: 0;
    transition: opacity 1.5s ease;
    z-index: 10;
  }

  #welcome-screen.active {
    display: flex;
  }

  #welcome-screen.visible {
    opacity: 1;
  }

  .welcome-bg {
    position: absolute; inset: 0;
    background-size: cover;
    background-position: center;
    filter: brightness(0.35) saturate(0.8);
    transform: scale(1.05);
    transition: transform 20s ease;
  }

  #welcome-screen.visible .welcome-bg {
    transform: scale(1.0);
  }

  .welcome-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(
      135deg,
      rgba(10,10,10,0.5) 0%,
      rgba(10,10,10,0.1) 50%,
      rgba(255,255,255,0.04) 100%
    );
  }

  .welcome-content {
    position: relative; z-index: 2;
    text-align: center;
    padding: 48px;
  }

  .welcome-label {
    font-size: 11px;
    letter-spacing: 6px;
    color: var(--gold);
    text-transform: uppercase;
    font-weight: 400;
    margin-bottom: 24px;
    opacity: 0;
    transform: translateY(20px);
    transition: all 1s ease 0.5s;
  }

  #welcome-screen.visible .welcome-label {
    opacity: 1; transform: translateY(0);
  }

  .welcome-divider {
    width: 60px; height: 1px;
    background: var(--gold);
    margin: 0 auto 32px;
    opacity: 0;
    transform: scaleX(0);
    transition: all 0.8s ease 0.8s;
  }

  #welcome-screen.visible .welcome-divider {
    opacity: 1; transform: scaleX(1);
  }

  .welcome-name {
    font-family: 'Bebas Neue', cursive;
    font-size: clamp(52px, 10vw, 96px);
    color: #fff;
    letter-spacing: 6px;
    line-height: 1;
    text-shadow: 0 0 60px rgba(255,255,255,0.25);
    opacity: 0;
    transform: translateY(30px);
    transition: all 1.2s ease 1s;
  }

  #welcome-screen.visible .welcome-name {
    opacity: 1; transform: translateY(0);
  }

  .welcome-session {
    font-size: 13px;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    margin-top: 20px;
    font-weight: 300;
    opacity: 0;
    transition: all 1s ease 1.4s;
  }

  #welcome-screen.visible .welcome-session {
    opacity: 1;
  }

  .studio-watermark {
    position: fixed;
    bottom: 40px; left: 50%;
    transform: translateX(-50%);
    font-family: 'Bebas Neue', cursive;
    font-size: 13px;
    letter-spacing: 6px;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
    z-index: 20;
  }

  /* ── CORNER DECORATIONS ── */
  .corner {
    position: fixed;
    width: 40px; height: 40px;
    z-index: 20;
    opacity: 0.4;
  }
  .corner-tl { top: 20px; left: 20px; border-top: 1px solid var(--gold); border-left: 1px solid var(--gold); }
  .corner-tr { top: 20px; right: 20px; border-top: 1px solid var(--gold); border-right: 1px solid var(--gold); }
  .corner-bl { bottom: 20px; left: 20px; border-bottom: 1px solid var(--gold); border-left: 1px solid var(--gold); }
  .corner-br { bottom: 20px; right: 20px; border-bottom: 1px solid var(--gold); border-right: 1px solid var(--gold); }

  /* ── IMAGE LOADING INDICATOR ── */
  .img-loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 1;
  }

  .img-loading-dot {
    width: 6px; height: 6px;
    background: var(--gold);
    border-radius: 50%;
    margin: 0 4px;
    animation: dotPulse 1.4s ease-in-out infinite;
  }
  .img-loading-dot:nth-child(2) { animation-delay: 0.2s; }
  .img-loading-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dotPulse {
    0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50% { transform: scale(1.02); opacity: 1; }
  }

  @keyframes rotateBorder {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* ── PIN OVERLAY ── */
  #pin-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(8px);
  }

  #pin-overlay.active {
    display: flex;
  }

  .pin-box {
    text-align: center;
    padding: 48px 40px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    width: 320px;
  }

  .pin-label {
    font-family: 'Bebas Neue', cursive;
    font-size: 13px;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    margin-bottom: 28px;
  }

  .pin-lock-icon {
    font-size: 32px;
    margin-bottom: 20px;
    opacity: 0.7;
  }

  .pin-dots {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 32px;
  }

  .pin-dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.4);
    background: transparent;
    transition: all 0.2s ease;
  }

  .pin-dot.filled {
    background: #fff;
    border-color: #fff;
  }

  .pin-dot.error {
    background: #ff4444;
    border-color: #ff4444;
  }

  .pin-dot.success {
    background: #44ff88;
    border-color: #44ff88;
  }

  .pin-keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .pin-key {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    font-size: 20px;
    font-weight: 400;
    padding: 18px;
    cursor: pointer;
    transition: all 0.15s ease;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .pin-key:active, .pin-key.pressed {
    background: rgba(255,255,255,0.2);
    transform: scale(0.95);
  }

  .pin-key.delete {
    font-size: 14px;
    color: rgba(255,255,255,0.5);
  }

  .pin-key.empty {
    visibility: hidden;
  }

  .pin-close {
    margin-top: 20px;
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.25);
    text-transform: uppercase;
    cursor: pointer;
    padding: 8px;
  }

  .pin-status {
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    margin-top: 16px;
    min-height: 16px;
    transition: all 0.3s ease;
  }

  .pin-status.error { color: #ff4444; }
  .pin-status.success { color: #44ff88; }

  /* Uhr klickbar */
  .logo-time {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .logo-time:active {
    opacity: 0.6;
  }


  /* ── KAMERA LIVE-ANZEIGE ── */
  #cam-live {
    position: fixed; top: 22px; left: 26px; z-index: 900;
    display: none; align-items: center; gap: 8px;
    font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 600;
    letter-spacing: 3px; color: rgba(255,255,255,0.75);
  }
  #cam-live.on { display: flex; }
  #cam-live .rec {
    width: 9px; height: 9px; border-radius: 50%; background: #ff3b30;
    animation: camPulse 1.6s ease-in-out infinite;
  }
  @keyframes camPulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  #cam-video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  /* ── FINGERABDRUCK-TASTE ── */
  .pin-key.finger { display: flex; align-items: center; justify-content: center; }
  .pin-key.finger svg { width: 34px; height: 34px; stroke: currentColor; opacity: .85; }
  .pin-key.finger.hidden { visibility: hidden; pointer-events: none; }
  .pin-key.finger.setup svg { opacity: .35; }
  .pin-key.finger.armed { animation: fingerPulse 1.2s ease-in-out infinite; }
  @keyframes fingerPulse { 50% { opacity: .35; } }

  /* ══ FINGERPRINT SCAN ══ */
  #scan {
    position: fixed; inset: 0; z-index: 2000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #000 radial-gradient(ellipse at 50% 45%, rgba(255,255,255,0.07) 0%, rgba(0,0,0,0) 62%);
    opacity: 0; pointer-events: none; transition: opacity .35s ease;
    --c: 255,255,255;
  }
  #scan.on { opacity: 1; pointer-events: auto; }
  #scan.fail { --c: 255,68,68; }
  #scan.ok { --c: 68,255,136; }

  .scan-rig { position: relative; width: min(46vh, 60vw); aspect-ratio: 200 / 240; }
  .scan-rig svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

  .fp-base path { stroke: rgba(var(--c), .13); stroke-width: 2.1; fill: none; stroke-linecap: round; transition: stroke .4s; }
  .fp-lit path  { stroke: rgb(var(--c)); stroke-width: 2.1; fill: none; stroke-linecap: round;
                  filter: drop-shadow(0 0 3px rgba(var(--c), .9)); transition: stroke .4s; }

  /* HUD-Ecken */
  .scan-corner { position: absolute; width: 16%; aspect-ratio: 1; border: 2px solid rgba(var(--c), .7); transition: all .5s cubic-bezier(.2,.9,.2,1); }
  .scan-corner.tl { top: -6%; left: -10%; border-right: 0; border-bottom: 0; }
  .scan-corner.tr { top: -6%; right: -10%; border-left: 0; border-bottom: 0; }
  .scan-corner.bl { bottom: -6%; left: -10%; border-right: 0; border-top: 0; }
  .scan-corner.br { bottom: -6%; right: -10%; border-left: 0; border-top: 0; }
  #scan.ok .scan-corner.tl { top: -2%; left: -4%; }  #scan.ok .scan-corner.tr { top: -2%; right: -4%; }
  #scan.ok .scan-corner.bl { bottom: -2%; left: -4%; } #scan.ok .scan-corner.br { bottom: -2%; right: -4%; }

  /* Scanlinie */
  .scan-beam {
    position: absolute; left: -14%; right: -14%; height: 3px; top: 0;
    background: linear-gradient(90deg, transparent, rgba(var(--c),.95) 20%, #fff 50%, rgba(var(--c),.95) 80%, transparent);
    box-shadow: 0 0 18px 4px rgba(var(--c), .55), 0 0 60px 12px rgba(var(--c), .18);
    border-radius: 3px; will-change: transform;
  }
  .scan-beam::after {
    content: ''; position: absolute; left: 10%; right: 10%; top: 3px; height: 60px;
    background: linear-gradient(to bottom, rgba(var(--c), .16), transparent);
  }
  #scan.ok .scan-beam, #scan.fail .scan-beam { opacity: 0; transition: opacity .3s; }

  /* Rotierende Ringe */
  .scan-ring { position: absolute; left: 50%; top: 46%; border-radius: 50%; transform: translate(-50%,-50%); pointer-events: none; }
  .scan-ring.r1 { width: 142%; aspect-ratio: 1; border: 1px dashed rgba(var(--c), .22); animation: spin 18s linear infinite; }
  .scan-ring.r2 { width: 128%; aspect-ratio: 1; border: 2px solid transparent; border-top-color: rgba(var(--c), .7); border-right-color: rgba(var(--c), .15); animation: spin 2.4s linear infinite; }
  .scan-ring.burst { width: 60%; aspect-ratio: 1; border: 2px solid rgba(var(--c), .9); opacity: 0; }
  #scan.ok .scan-ring.burst { animation: burst 1s cubic-bezier(.1,.8,.2,1) forwards; }
  #scan.ok .scan-ring.burst.b2 { animation-delay: .15s; }
  @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }
  @keyframes burst { 0% { opacity: .9; width: 60%; } 100% { opacity: 0; width: 260%; border-width: 1px; } }

  .scan-text { margin-top: 7vh; text-align: center; min-height: 90px; }
  .scan-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(34px, 6vh, 64px); letter-spacing: 8px; color: rgb(var(--c)); text-shadow: 0 0 24px rgba(var(--c), .5); transition: color .4s; }
  .scan-sub { margin-top: 8px; font-size: 12px; letter-spacing: 4px; color: rgba(255,255,255,.5); font-weight: 600; }
  .scan-pct { font-variant-numeric: tabular-nums; }

  #scan.fail .scan-rig { animation: glitch .5s steps(2) 1; }
  @keyframes glitch {
    0% { transform: translate(0,0); } 20% { transform: translate(-8px,2px); filter: hue-rotate(20deg); }
    40% { transform: translate(7px,-3px); } 60% { transform: translate(-5px,1px); } 80% { transform: translate(4px,0); } 100% { transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { .scan-ring.r1, .scan-ring.r2 { animation: none; } }

  /* ── FINGERABDRUCK-BUTTON UNTEN LINKS (dezent) ── */
  #finger-btn {
    position: fixed; z-index: 30;
    left: calc(env(safe-area-inset-left, 0px) + 58px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 44px);
    width: 44px; height: 44px;              /* Tippfläche */
    display: none; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.22);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: color .2s ease;
  }
  #finger-btn.show { display: flex; }
  #finger-btn svg { width: 20px; height: 20px; stroke: currentColor; }
  #finger-btn:active { color: rgba(255,255,255,0.7); }
</style>
</head>

<!-- Kamera: Live-Hinweis für Besucher -->
<div id="cam-live"><span class="rec"></span>KAMERA AKTIV</div>
<video id="cam-video" autoplay muted playsinline></video>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// ════════════════════════════════════════════════
// TÜRKAMERA – iPad sendet Livebild an cam.html
// ════════════════════════════════════════════════
const CAM_CONFIG = {
  peerId: 'ccs-tuer-kamera-7f3k9q2x',  // muss identisch sein in cam.html
  // SHA-256 des Zugangscodes (Code selbst steht NICHT in dieser Datei)
  codeHash: '3ad880fd8a38e064ed3662f0d9f4d0a2b96aef76cc9a4dbe548d6561d64f7c27',
  facingMode: 'user',                  // 'user' = Frontkamera, 'environment' = Rückkamera
  idleTimeout: 15000,                  // Viewer trennen, wenn er so lange kein Signal sendet
  keepAlive: true,                     // Kamera nach dem Start offen halten -> Safari fragt nur 1x pro Seitenaufruf
};

const camState = { peer: null, stream: null, viewers: new Map(), retryTimer: null, slot: 0 };
const CAM_SLOTS = 5; // Ausweich-IDs, falls eine alte Sitzung die ID noch blockiert

async function camSha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

function camTrackOk() {
  const t = camState.stream && camState.stream.getVideoTracks()[0];
  return !!(t && t.readyState === 'live' && !t.muted && t.enabled);
}

// Kamera holen – oder neu holen, wenn iOS sie stumm/beendet hat (schwarzes Bild)
async function camStartStream(force) {
  if (!force && camTrackOk()) return camState.stream;
  if (camState.starting) return camState.starting;
  camState.starting = (async () => {
    const old = camState.stream;
    const fresh = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: CAM_CONFIG.facingMode, width: { ideal: 1280 }, height: { ideal: 720 }, aspectRatio: { ideal: 16 / 9 } },
      audio: false,
    });
    const track = fresh.getVideoTracks()[0];
    track.addEventListener('ended', () => camHeal('ended'));
    track.addEventListener('mute', () => setTimeout(() => { if (track.muted) camHeal('mute'); }, 1500));
    camState.stream = fresh;
    const vid = document.getElementById('cam-video');
    vid.srcObject = fresh; vid.play().catch(() => {});
    // Laufende Übertragungen auf die neue Kamera umhängen (ohne neu zu verbinden)
    camState.viewers.forEach((v) => {
      try {
        const pc = v.call && v.call.peerConnection;
        if (pc) pc.getSenders().forEach((s) => { if (s.track === null || s.track.kind === 'video') s.replaceTrack(track); });
      } catch (e) {}
    });
    if (old && old !== fresh) old.getTracks().forEach((t) => t.stop());
    camState.lastError = '';
    return fresh;
  })();
  try { return await camState.starting; } finally { camState.starting = null; }
}

let camHealTimer = null;
function camHeal(reason) {
  if (document.hidden) return; // im Hintergrund lässt iOS keine Kamera zu
  clearTimeout(camHealTimer);
  camHealTimer = setTimeout(() => {
    camStartStream(true).catch((e) => { camState.lastError = 'Kamera (' + reason + '): ' + (e.name || e.message); });
  }, 500);
}

function camUpdateLive() {
  document.getElementById('cam-live').classList.toggle('on', camState.viewers.size > 0 && !!camState.stream);
}

function camStopStream() {
  if (CAM_CONFIG.keepAlive) { camUpdateLive(); return; }
  if (camState.stream) camState.stream.getTracks().forEach(t => t.stop());
  camState.stream = null;
  document.getElementById('cam-video').srcObject = null;
  document.getElementById('cam-live').classList.remove('on');
}

function camDropViewer(id) {
  const v = camState.viewers.get(id);
  if (!v) return;
  clearInterval(v.watchdog);
  try { v.call && v.call.close(); } catch (e) {}
  try { v.conn.close(); } catch (e) {}
  camState.viewers.delete(id);
  if (camState.viewers.size === 0) camStopStream(); else camUpdateLive();
}

function camHandleConnection(conn) {
  conn.on('open', async () => {
    const code = (conn.metadata && conn.metadata.code) || '';
    if ((await camSha256(String(code))) !== CAM_CONFIG.codeHash) {
      conn.send({ type: 'denied' });
      setTimeout(() => conn.close(), 500);
      return;
    }
    const viewer = { conn, call: null, lastPing: Date.now(), watchdog: null };
    camState.viewers.set(conn.peer, viewer);
    viewer.watchdog = setInterval(() => {
      if (Date.now() - viewer.lastPing > CAM_CONFIG.idleTimeout) camDropViewer(conn.peer);
    }, 3000);

    try {
      const stream = await camStartStream();
      viewer.call = camState.peer.call(conn.peer, stream);
      camUpdateLive();
      viewer.call.on('close', () => camDropViewer(conn.peer));
      conn.send({ type: 'ok' });
    } catch (e) {
      camState.lastError = 'Kamera: ' + (e.name || e.message);
      conn.send({ type: 'error', message: 'Kamera nicht verfügbar: ' + (e.name || e.message) });
      camDropViewer(conn.peer);
    }
  });
  conn.on('data', (msg) => {
    const v = camState.viewers.get(conn.peer);
    if (!v) return;
    if (msg && msg.type === 'ping') v.lastPing = Date.now();
    if (msg && msg.type === 'bye') camDropViewer(conn.peer);
    if (msg && msg.type === 'refresh') camHeal('viewer');
  });
  conn.on('close', () => camDropViewer(conn.peer));
  conn.on('error', () => camDropViewer(conn.peer));
}

function camInitPeer() {
  if (typeof Peer === 'undefined') { camScheduleRetry(10000); return; }
  const old = camState.peer;
  camState.peer = null;
  if (old && !old.destroyed) old.destroy();
  [...camState.viewers.keys()].forEach(camDropViewer);
  const id = CAM_CONFIG.peerId + (camState.slot ? '-' + camState.slot : '');
  const peer = new Peer(id, {
    config: { iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:global.stun.twilio.com:3478' },
    ]},
  });
  camState.peer = peer;
  peer.on('connection', camHandleConnection);
  peer.on('open', () => { camState.lastError = ''; });
  const current = () => camState.peer === peer;
  peer.on('disconnected', () => {
    if (!current() || peer.destroyed) return;
    setTimeout(() => { if (current() && peer.disconnected && !peer.destroyed) { try { peer.reconnect(); } catch (e) { camScheduleRetry(5000); } } }, 2000);
  });
  peer.on('error', (err) => {
    console.log('Kamera-Peer Fehler:', err.type);
    camState.lastError = err.type;
    if (!current()) return;
    if (err.type === 'unavailable-id') { camState.slot = (camState.slot + 1) % CAM_SLOTS; camScheduleRetry(1500); return; }
    if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(err.type)) camScheduleRetry(8000);
  });
  peer.on('close', () => { if (current()) camScheduleRetry(8000); });
}

function camScheduleRetry(ms) {
  clearTimeout(camState.retryTimer);
  camState.retryTimer = setTimeout(camInitPeer, ms);
}

// Nach Standby / Netzwechsel neu verbinden
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && (!camState.peer || camState.peer.destroyed || camState.peer.disconnected)) camInitPeer();
});
window.addEventListener('online', () => camInitPeer());

// Diagnose: studio-display.html?camdebug in der Adresszeile
const camDebug = new URLSearchParams(location.search).has('camdebug');
if (camDebug) {

    box.innerHTML = 'Build 8<br>Touch ID: ' + fingerDiag + '<br>Peer: ' + st + ' (Slot ' + camState.slot + ')' + '<br>Viewer: ' + camState.viewers.size +
      '<br>Kamera: ' + (camState.stream ? (camTrackOk() ? 'an ✓' : 'STUMM/BEENDET') : 'aus') + (camState.lastError ? '<br>Fehler: ' + camState.lastError : '');
  }, 1000);
}

camInitPeer();
if (CAM_CONFIG.keepAlive) {
  camStartStream().catch(e => { camState.lastError = 'Kamera: ' + (e.name || e.message); });
  // Falls iOS die Kamera im Hintergrund abgestellt hat: beim Zurückkommen neu holen
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) camHeal('visible');
  });
  window.addEventListener('pageshow', () => camHeal('pageshow'));
  // Sicherheitsnetz: alle 20 s prüfen, ob die Kamera wirklich liefert
  setInterval(() => { if (!document.hidden && !camTrackOk()) camHeal('check'); }, 20000);
}

const FINGER_STORE = 'ccs-touchid-cred';
let fingerSupported = false, fingerSetupMode = false, fingerSetupReady = false, fingerBusy = false;

function fingerCredId() { try { return localStorage.getItem(FINGER_STORE) || ''; } catch (e) { return ''; } }
function b64urlEncode(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function b64urlDecode(str) {
  str = str.replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '=';
  return Uint8Array.from(atob(str), c => c.charCodeAt(0));
}
function setFingerStatus(text, kind) {
  const el = document.getElementById('pin-status');
  el.textContent = text; el.className = 'pin-status' + (kind ? ' ' + kind : '');

function fingerUpdateKey() {

var fingerDiag = 'prüfe …';
(async () => {
  try {
    if (!window.PublicKeyCredential) { fingerDiag = 'nein (Browser ohne WebAuthn)'; }
    else if (!window.isSecureContext) { fingerDiag = 'nein (keine HTTPS-Seite)'; }
    else {
      fingerSupported = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
      fingerDiag = fingerSupported ? 'ja' : 'nein (kein Touch ID / Face ID eingerichtet)';
    }
  } catch (e) { fingerSupported = false; fingerDiag = 'Fehler: ' + e.name; }

function fingerCreateOptions() {
  return { publicKey: {
    challenge: crypto.getRandomValues(new Uint8Array(32)),
    rp: { name: 'Closed Circle Studios' },
    user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'studio-tuere', displayName: 'Studio Türe' },
    pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
    authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
    attestation: 'none',
    timeout: 60000,
  }};
}

async function fingerRegister() {
  fingerBusy = true;
  try {
    const cred = await navigator.credentials.create(fingerCreateOptions());
    localStorage.setItem(FINGER_STORE, b64urlEncode(cred.rawId));
    fingerSetupReady = false;
    fingerUpdateKey();
    setFingerStatus('✓ Fingerabdruck eingerichtet', 'success');
    setTimeout(() => { if (!pinLocked) closePinOverlay(); }, 1800);
  } catch (e) {
    fingerSetupReady = false; fingerUpdateKey();
    setFingerStatus(e.name === 'NotAllowedError' ? 'Einrichtung abgebrochen' : 'Einrichtung fehlgeschlagen (' + e.name + ')', 'error');
  } finally { fingerBusy = false; }
}

async function fingerAuthenticate() {
  const id = fingerCredId();
  if (!id || fingerBusy) return;
  fingerBusy = true;
  // Wichtig: get() noch synchron im Tipp-Ereignis starten, Animation parallel
  const req = navigator.credentials.get({ publicKey: {
    challenge: crypto.getRandomValues(new Uint8Array(32)),
    allowCredentials: [{ type: 'public-key', id: b64urlDecode(id), transports: ['internal'] }],
    userVerification: 'required',
    timeout: 60000,

  scanStart();
  try {
    await req;
    pinLocked = true;
    await scanGranted();
    await openNukiDoor();
    scanSetText(doorOpen ? 'Türe offen' : 'Türe zu', 'Closed Circle Studios');
    setTimeout(() => {
      scanHide();
      closePinOverlay();
      pinLocked = false;
    }, 2400);
  } catch (e) {
    if (e.name === 'NotAllowedError' || e.name === 'AbortError') {
      scanHide(); // abgebrochen -> einfach zurück
    } else {
      await scanDenied();
      setFingerStatus('Fingerabdruck nicht erkannt – PIN eingeben', 'error');

  } finally {
    fingerBusy = false;
  }
}

(function buildFingerprint() {
  // Fingerabdruck aus Bogen-Linien generieren (fester Seed -> immer gleich)
  let seed = 7;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const cx = 100, cy = 100, paths = [];
  const arc = (rx, ry, a0, a1, ox) => {
    let d = '';
    for (let a = a0; a <= a1 + 0.001; a += 0.06) {
      const x = cx + ox + rx * Math.cos(a), y = cy - ry * Math.sin(a) * (a > Math.PI || a < 0 ? 0.8 : 1);
      d += (d ? ' L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    }
    return d;
  };
  for (let i = 0; i < 15; i++) {
    const rx = 7 + i * 5.6, ry = 11 + i * 6.6, ox = Math.sin(i * 0.7) * 1.5;
    const spread = 0.8 + Math.min(i, 10) * 0.04;
    let a0 = -spread, a1 = Math.PI + spread;
    // 1–2 Unterbrüche pro Linie, wie bei echten Papillarleisten
    const breaks = i < 2 ? 0 : (rnd() < 0.5 ? 1 : 2);
    const cuts = [];
    for (let b = 0; b < breaks; b++) cuts.push(a0 + (a1 - a0) * (0.15 + rnd() * 0.7));
    cuts.sort((x, y) => x - y);
    let start = a0;
    cuts.forEach((c) => { paths.push(arc(rx, ry, start, c - 0.07, ox)); start = c + 0.07; });
    paths.push(arc(rx, ry, start, a1, ox));
  }
  // untere, flachere Linien
  for (let j = 0; j < 5; j++) {
    const y = 176 + j * 9, w = 78 - j * 8;
    paths.push(`M${100 - w} ${y} Q100 ${y - 14 + j * 2} ${100 + w} ${y}`);
  }
  const svgNS = 'http://www.w3.org/2000/svg';
  ['fp-base', 'fp-lit'].forEach((g) => {
    const el = document.getElementById(g);
    paths.forEach((d) => { const p = document.createElementNS(svgNS, 'path'); p.setAttribute('d', d); el.appendChild(p); });
  });
})();

let scanRaf = null, scanT0 = 0, scanMode = 'idle';
function scanSetText(title, sub) {
  document.getElementById('scan-title').textContent = title;
  document.getElementById('scan-sub').innerHTML = sub;
}
function scanLoop(t) {
  const rig = document.querySelector('.scan-rig');
  const h = rig.clientHeight;
  const rect = document.getElementById('fp-clip-rect');
  const beam = document.getElementById('scan-beam');
  const el = (t - scanT0) / 1000;
  if (scanMode === 'scanning') {
    // Linie fährt hoch und runter, beleuchtete Fläche wächst mit
    const phase = (Math.sin(el * 2.2 - Math.PI / 2) + 1) / 2; // 0..1
    const y = phase * 240;
    beam.style.transform = `translateY(${(phase * h).toFixed(1)}px)`;
    const band = 34;
    rect.setAttribute('y', Math.max(0, y - band));
    rect.setAttribute('height', band * 2);
    const pct = Math.min(99, Math.floor(el * 23));
    document.getElementById('scan-sub').innerHTML = 'SCANNE <span class="scan-pct">' + String(pct).padStart(2, '0') + '%</span>';
  }
  scanRaf = requestAnimationFrame(scanLoop);
}
function scanStart() {
  const sc = document.getElementById('scan');
  sc.classList.remove('ok', 'fail');
  scanSetText('Finger auflegen', 'SCANNE <span class="scan-pct">00%</span>');
  scanMode = 'scanning';
  scanT0 = performance.now();
  document.querySelectorAll('#fp-lit path').forEach((p) => { p.style.transition = 'none'; p.style.strokeDasharray = ''; p.style.strokeDashoffset = ''; });
  sc.classList.add('on');
  cancelAnimationFrame(scanRaf); scanRaf = requestAnimationFrame(scanLoop);
}
function scanGranted() {
  return new Promise((resolve) => {
    scanMode = 'granted';
    const sc = document.getElementById('scan');
    const rect = document.getElementById('fp-clip-rect');
    rect.setAttribute('y', -20); rect.setAttribute('height', 280);
    // Linien von innen nach aussen "einbrennen"
    const lit = [...document.querySelectorAll('#fp-lit path')];
    lit.forEach((p, i) => {
      const L = p.getTotalLength();
      p.style.transition = 'none';
      p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
      p.getBoundingClientRect();
      p.style.transition = `stroke-dashoffset .7s cubic-bezier(.3,.8,.3,1) ${i * 0.025}s, stroke .4s`;
      p.style.strokeDashoffset = 0;
    });
    sc.classList.add('ok');
    scanSetText('Zugang', 'IDENTITÄT BESTÄTIGT');
    setTimeout(resolve, 1100);
  });
}
function scanDenied() {
  return new Promise((resolve) => {
    scanMode = 'denied';
    const sc = document.getElementById('scan');
    sc.classList.add('fail');
    scanSetText('Kein Zugang', 'NICHT ERKANNT');
    setTimeout(() => { scanHide(); resolve(); }, 1600);
  });
}
function scanHide() {
  scanMode = 'idle';
  document.getElementById('scan').classList.remove('on');
  setTimeout(() => {
    if (scanMode !== 'idle') return;
    cancelAnimationFrame(scanRaf);
    document.getElementById('scan').classList.remove('ok', 'fail');
  }, 400);
}

// Taste 3 s halten = Fingerabdruck zurücksetzen (nur nach PIN)
(() => {
  let t = null;
  const k = document.getElementById('finger-key');
  const start = () => { t = setTimeout(() => {
    if (!fingerCredId()) return;
    fingerSuppressClick = true;
    fingerSetupMode = true; fingerResetPending = true;
    pinInput = ''; updatePinDots();
    setFingerStatus('PIN eingeben, um Fingerabdruck zu löschen');
  }, 3000); };
  const stop = () => clearTimeout(t);
  k.addEventListener('touchstart', start, { passive: true }); k.addEventListener('mousedown', start);
  k.addEventListener('touchend', stop); k.addEventListener('mouseup', stop); k.addEventListener('mouseleave', stop);
})();
let fingerResetPending = false;

// Fingerabdruck-Button unten links: öffnen/schliessen ohne Code.
// Noch nichts eingerichtet? -> Tippen richtet Touch ID direkt ein
// (iOS verlangt dabei selbst einen gespeicherten Finger oder den iPad-Code).
function fingerUnavailable() {
  scanStart();
  scanDenied().then(() => {});
  scanSetText('Touch ID aus', fingerDiag.replace(/^nein \(|\)$/g, '').toUpperCase());
}

function fingerButtonTap() {
  if (!fingerSupported) { if (!fingerBusy) fingerUnavailable(); return; }
  if (pinLocked || fingerBusy) return;
  if (document.getElementById('pin-overlay').classList.contains('active')) return;
  if (fingerCredId()) { fingerAuthenticate(); return; }
  fingerRegisterWithScan();
}

async function fingerRegisterWithScan() {
  fingerBusy = true;
  const req = navigator.credentials.create(fingerCreateOptions()); // synchron im Tipp starten
  scanStart();
  scanSetText('Finger einrichten', 'TOUCH ID');
  try {
    const cred = await req;
    localStorage.setItem(FINGER_STORE, b64urlEncode(cred.rawId));
    fingerUpdateKey();
    await scanGranted();
    scanSetText('Eingerichtet', 'AB JETZT MIT FINGER ÖFFNEN');
    setTimeout(scanHide, 1800);
  } catch (e) {
    if (e.name === 'NotAllowedError' || e.name === 'AbortError') scanHide();
    else { await scanDenied(); }
  } finally {
    fingerBusy = false;
  }
}

checkStatus();
setInterval(checkStatus, CONFIG.checkInterval * 1000);
